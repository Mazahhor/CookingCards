name: Keep Supabase awake

# Supabase pauses free-plan projects after about 7 days with no database
# activity, which is what took Cooking Steps offline. This makes one tiny
# read every 3 days so the project always counts as active.
#
# The key below is the PUBLIC anon key already shipped inside the app at
# /app/index.html - it is safe to expose and grants nothing on its own
# (row level security decides what it can actually read).
#
# Note: GitHub disables scheduled workflows in a repo with no commits for
# 60 days. This repo gets a commit on every deploy, so that is not a risk
# today, but if deploys ever stop for two months, re-enable it in the
# Actions tab.

on:
  schedule:
    - cron: "0 6 */3 * *"     # 06:00 UTC, every 3rd day
  workflow_dispatch:           # also runnable by hand from the Actions tab

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Read one public row
        env:
          SUPA_URL: "https://rfmmwawgwpuppptjfabi.supabase.co"
          SUPA_KEY: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InJmbW13YXdnd3B1cHBwdGpmYWJpIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODQ0MDgzOTcsImV4cCI6MjA5OTk4NDM5N30.J2ILmzXo2ZgK0ysYfVLZF7Y4wd-vy6X8FI0LL4wqTxI"
        run: |
          # NOTE: deliberately no `set -e`. curl exits non-zero (6) when the
          # hostname does not resolve, which is EXACTLY the paused-project case
          # we most want to explain - with -e the script died before printing
          # anything useful and the log just said "exit code 6".
          set -uo pipefail
          http=$(curl -sS --max-time 30 -o /tmp/body.txt -w '%{http_code}' \
            -H "apikey: ${SUPA_KEY}" \
            -H "Authorization: Bearer ${SUPA_KEY}" \
            "${SUPA_URL}/rest/v1/profiles?select=id&limit=1" 2>/tmp/err.txt)
          rc=$?

          if [ "${rc}" -ne 0 ]; then
            echo "curl failed (exit ${rc}):"
            cat /tmp/err.txt || true
            if grep -qi "could not resolve host" /tmp/err.txt 2>/dev/null; then
              echo
              echo "=============================================================="
              echo " The project hostname does not resolve."
              echo " Supabase REMOVES DNS for paused free-plan projects, so this"
              echo " is the signature of a paused project, not a network fault."
              echo
              echo " Fix: Supabase Dashboard -> project rfmmwawgwpuppptjfabi ->"
              echo "      Resume. Data is preserved (1-year restore window)."
              echo
              echo " This job will keep failing every 3 days until it is resumed."
              echo "=============================================================="
            fi
            exit 1
          fi

          echo "HTTP ${http}"
          head -c 300 /tmp/body.txt || true
          echo
          if [ "${http}" != "200" ]; then
            echo "Supabase answered ${http} instead of 200 - check the project health." >&2
            exit 1
          fi
          echo "Supabase is awake."
